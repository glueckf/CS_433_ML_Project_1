name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  tests:
    name: Tests and spec compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Covers the unit tests plus tests/test_spec_compliance.py, which
      # enforces the course rules that are easiest to break by accident:
      # the allowed-library list, the six required signatures, the "no todo"
      # rule, and the notebook discipline.
      - name: pytest
        run: pytest
